<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>测试页</title></head>
<body>
<h2>文献调研智能体 — 测试页</h2>
<p>点击下面按钮测试 JS 是否工作：</p>

<button id="btn1" style="font-size:18px;padding:10px 20px;margin:5px;">测试按钮 1</button>
<button id="btn2" style="font-size:18px;padding:10px 20px;margin:5px;">测试按钮 2 (fetch API)</button>

<p id="result" style="margin-top:20px;font-size:16px;color:#666;">等待操作...</p>

<script>
var btn1 = document.getElementById("btn1");
var btn2 = document.getElementById("btn2");
var result = document.getElementById("result");

btn1.onclick = function() {
  result.innerHTML = "✓ 按钮 1 被点击了！JS 运行正常！";
  result.style.color = "green";
};

btn2.onclick = function() {
  result.innerHTML = "正在测试 API 连接...";
  result.style.color = "blue";
  try {
    fetch("http://localhost:8765/api/status/test")
      .then(function(r) { return r.json(); })
      .then(function(d) {
        result.innerHTML = "✓ API 连接正常！返回: " + JSON.stringify(d);
        result.style.color = "green";
      })
      .catch(function(e) {
        result.innerHTML = "✗ API 连接失败: " + e.message;
        result.style.color = "red";
      });
  } catch(e) {
    result.innerHTML = "✗ fetch 调用失败: " + e.message;
    result.style.color = "red";
  }
};
</script>
</body>
</html>
